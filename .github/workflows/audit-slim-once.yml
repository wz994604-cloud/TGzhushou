name: audit-slim-once
on:
  push:
    branches: [audit-20261005-code-health]
    paths: [.github/workflows/audit-slim-once.yml]
permissions:
  contents: write
jobs:
  slim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-20261005-code-health
          fetch-depth: 0
      - name: Restore unrelated browser specs
        run: |
          git checkout origin/main -- tests/browser/performance.spec.js tests/browser/player-import.spec.js tests/browser/workbench-nine.spec.js
          git rm .github/workflows/audit-slim-once.yml
          git diff --cached --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -am "chore: trim unrelated audit diff"
          git push origin HEAD:audit-20261005-code-health
