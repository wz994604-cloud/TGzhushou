name: audit-fix-once

on:
  push:
    branches:
      - audit-20261005-code-health
    paths:
      - .github/workflows/audit-fix-once.yml

concurrency:
  group: audit-fix-audit-20261005-code-health
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-20261005-code-health
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Validate one-shot scripts
        run: |
          node --check tools/audit-prepare.mjs
          node --check tools/audit-prepatch.mjs
          node --check tools/audit-async-transform.cjs
      - name: Apply focused source patches
        run: |
          node tools/audit-prepare.mjs
          node tools/audit-prepatch.mjs
      - name: Convert database call sites to async
        run: |
          FILES=$(find server tests -name '*.js' ! -path 'server/db.js' -print)
          npx --yes jscodeshift@17.3.0 -t tools/audit-async-transform.cjs $FILES --parser=babel
      - name: Install project dependencies
        run: npm ci
      - name: Targeted syntax and behavior verification
        run: |
          node --check server/db.js
          node --check server/index.js
          node --check server/chat.js
          node --check server/browser-auth.js
          node --check server/player-store.js
          node --check server/publishers.js
          node --check server/scheduler.js
          node --check server/sent-actions.js
          timeout 120s npm test
          timeout 60s npm run check
          timeout 120s npm run build
      - name: Commit verified fixes to audit branch only
        run: |
          git rm tools/audit-prepare.mjs tools/audit-prepatch.mjs tools/audit-async-transform.cjs .github/workflows/audit-fix-once.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: harden scheduler database and runtime health"
          git push origin HEAD:audit-20261005-code-health

